# Perfil de testes: conexões reais vêm do Testcontainers (@ServiceConnection).
# Os valores abaixo apenas satisfazem os placeholders obrigatórios de application.yml.
spring:
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/shf
    username: test
    password: test
  data:
    redis:
      host: overridden-by-testcontainers
  rabbitmq:
    host: overridden-by-testcontainers
    username: test
    password: test
  security:
    oauth2:
      resourceserver:
        jwt:
          # Nunca é contatado: os testes usam o post-processor jwt() do spring-security-test.
          issuer-uri: http://issuer.test/realms/smart-health-finance

shf:
  security:
    cors-allowed-origins: http://localhost:3000
    # Spec servido só para o snapshot do contrato (OpenApiContractIT, ADR-0010).
    public-api-docs: true

# Gerado só para o snapshot do contrato (OpenApiContractIT, ADR-0010).
springdoc:
  api-docs:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
