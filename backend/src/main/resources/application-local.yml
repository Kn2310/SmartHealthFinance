# Perfil local: aponta para infrastructure/docker-compose.yml.
# Credenciais NÃO têm default: vêm de backend/.env (modelo em .env.example) ou de variáveis de ambiente.
spring:
  config:
    # backend/.env (ignorado pelo Git). Relativo ao diretório de execução (backend/).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shf}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/smart-health-finance}

shf:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    public-api-docs: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
