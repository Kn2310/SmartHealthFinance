# Configuração base. Valores de ambiente vêm SEMPRE de variáveis de ambiente / secret manager.
# Defaults locais ficam apenas em application-local.yml.
spring:
  application:
    name: smart-health-finance-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema pertence exclusivamente ao Flyway
    properties:
      hibernate:
        # Inserts em lote na importação (ADR-0009): ids são atribuídos pela aplicação, então o batching funciona.
        jdbc.batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis é só cache/rate limit/locks (nunca source of truth): sem repositórios Spring Data Redis.
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # O relay da outbox só marca um evento como publicado depois do confirm do broker (ADR-0009 §14).
    publisher-confirm-type: simple
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

shf:
  overview:
    # Fuso que define "hoje" no Overview (ADR-0006); o Workspace ainda não tem fuso próprio.
    zone: ${OVERVIEW_ZONE:America/Sao_Paulo}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    public-api-docs: false
  # Transactional Outbox (ADR-0009 §14).
  outbox:
    relay:
      interval-ms: 1000
      confirm-timeout: 5s
    published-retention: 7d
    processed-retention: 30d
  ingestion:
    import:
      # Retry de falhas transitórias do Import Worker: backoff exponencial (x2) + jitter; depois, DLQ.
      retry:
        max-retries: 4
        delay: 1s
        max-delay: 30s
        jitter: 500ms

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: ecs # logs JSON; MDC (traceId, spanId, correlationId) incluído automaticamente
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
      group:
        readiness:
          include: readinessState,db,redis,rabbit
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
