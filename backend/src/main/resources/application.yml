# Configuração base. Valores de ambiente vêm SEMPRE de variáveis de ambiente / secret manager.
# Defaults locais ficam apenas em application-local.yml.
spring:
  application:
    name: smart-health-finance-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema pertence exclusivamente ao Flyway
    properties:
      hibernate:
        # Inserts em lote na importação (ADR-0009): ids são atribuídos pela aplicação, então o batching funciona.
        jdbc.batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis lento não pode segurar requisições (rate limit do Copilot falha fechado, ADR-0039 §10).
      timeout: 1s
      connect-timeout: 1s
      # Redis é só cache/rate limit/locks (nunca source of truth): sem repositórios Spring Data Redis.
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    # O relay da outbox só marca um evento como publicado depois do confirm do broker (ADR-0009 §14).
    publisher-confirm-type: simple
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

shf:
  overview:
    # Fuso que define "hoje" no Overview (ADR-0006); o Workspace ainda não tem fuso próprio.
    zone: ${OVERVIEW_ZONE:America/Sao_Paulo}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    public-api-docs: false
  # Transactional Outbox (ADR-0009 §14).
  outbox:
    relay:
      interval-ms: 1000
      confirm-timeout: 5s
    published-retention: 7d
    processed-retention: 30d
  # Comerciantes (ADR-0013).
  transactions:
    # Na inicialização: outdated (comerciantes de versão anterior do normalizador) ou off.
    merchant-renormalize: ${MERCHANT_RENORMALIZE:outdated}
  # Projeção de Analytics (ADR-0014).
  analytics:
    # Na inicialização: missing (backfill do deploy e de nova versão), all (runbook) ou off.
    rebuild: ${ANALYTICS_REBUILD:missing}
    # Evento publicado até esta margem antes do último recálculo do mês já está refletido (coalescência).
    coalesce-margin: 2s
    retry:
      max-retries: 4
      delay: 1s
      max-delay: 30s
      jitter: 500ms
  # Snapshot do Financial Health (ADR-0018).
  health:
    # Na inicialização, depois do rebuild do Analytics: missing (backfill do deploy e de nova versão), all ou off.
    rebuild: ${HEALTH_REBUILD:missing}
    # Debounce: cada evento adia o recálculo em quiet, nunca além de max-wait desde o primeiro evento pendente.
    debounce:
      quiet: 10s
      max-wait: 60s
    job:
      interval-ms: 5000
      batch-size: 50
      failure-backoff: 60s
    # O calendário muda o resultado sem evento: marca todos os Workspaces com snapshot (fuso de shf.overview.zone).
    daily:
      cron: "0 5 0 * * *"
    retry:
      max-retries: 4
      delay: 1s
      max-delay: 30s
      jitter: 500ms
  # Snapshot do Forecast (ADR-0030/0031): mesmo padrão do Health, com debounce e job.
  forecast:
    # Na inicialização, depois do rebuild do Analytics: missing (backfill do deploy e de nova versão), all ou off.
    rebuild: ${FORECAST_REBUILD:missing}
    debounce:
      quiet: 10s
      max-wait: 60s
    job:
      interval-ms: 5000
      batch-size: 50
      failure-backoff: 60s
    # O calendário muda o resultado sem evento: marca todos os Workspaces com snapshot (fuso de shf.overview.zone).
    daily:
      cron: "0 7 0 * * *"
    retry:
      max-retries: 4
      delay: 1s
      max-delay: 30s
      jitter: 500ms
  # Insights (ADR-0021/0022, ADR-0031 §7): gerados depois de cada health.snapshot-updated e forecast.snapshot-updated.
  insights:
    # Na inicialização: missing (backfill do deploy e de nova versão), all (runbook) ou off. Só marca para o job.
    rebuild: ${INSIGHTS_REBUILD:missing}
    debounce:
      quiet: 10s
      max-wait: 60s
    job:
      interval-ms: 5000
      batch-size: 50
      failure-backoff: 60s
    # Retenção de 13 meses dos insights não visíveis (fuso de shf.overview.zone).
    purge:
      cron: "0 20 0 * * *"
    retry:
      max-retries: 4
      delay: 1s
      max-delay: 30s
      jitter: 500ms
  ingestion:
    import:
      # Retry de falhas transitórias do Import Worker: backoff exponencial (x2) + jitter; depois, DLQ.
      retry:
        max-retries: 4
        delay: 1s
        max-delay: 30s
        jitter: 500ms
  # Financial Copilot / AI Gateway (ADR-0039). Simulado por padrão: o provedor real só com COPILOT_PROVIDER=anthropic e
  # ANTHROPIC_API_KEY vinda de variável de ambiente ou secret (nunca versionada). CI e testes usam sempre o simulado.
  copilot:
    enabled: ${COPILOT_ENABLED:true}
    provider: ${COPILOT_PROVIDER:simulated}
    # Quotas contam no fuso de negócio (o mesmo "hoje" do Overview).
    zone: ${shf.overview.zone}
    models:
      intent: claude-haiku-5-5
      answer: claude-sonnet-5-5
      intent-max-tokens: 1024
      answer-max-tokens: 4096
      effort: low
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      intent-timeout: 5s
      answer-timeout: 25s
    simulated:
      # ok, refused, invalid_output, timeout, rate_limited ou unavailable (simula o provedor real).
      mode: ${COPILOT_SIMULATED_MODE:ok}
    resilience:
      retry-max-attempts: 2
      retry-initial-wait: 500ms
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 5
      open-state-duration: 30s
      half-open-calls: 1
      max-concurrent-calls: 16
    # Provisórios até o M12 (ADR-0039 §10): por Workspace; rate limit por pessoa.
    limits:
      daily-questions: 10
      monthly-questions: 100
      monthly-input-tokens: 1000000
      bucket-capacity: 3
      refill-interval: 20s
    # USD por milhão de tokens, da página oficial de preços em 2026-11-10 (runbook: como atualizar).
    pricing:
      version: pricing-2026-11
      models:
        - model: claude-haiku-5-5
          input: 0.10
          output: 0.50
          cache-read: 0.01
          cache-write: 0.125
          long-prompt-threshold: 100000
          long-input: 0.50
          long-output: 2.50
          long-cache-read: 0.05
          long-cache-write: 0.625
        - model: claude-sonnet-5-5
          input: 2.00
          output: 10.00
          cache-read: 0.10
          cache-write: 2.50
        - model: simulated-v1
          input: 0
          output: 0
          cache-read: 0
          cache-write: 0

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: ecs # logs JSON; MDC (traceId, spanId, correlationId) incluído automaticamente
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
      group:
        readiness:
          include: readinessState,db,redis,rabbit
  metrics:
    distribution:
      # p50/p95 do Copilot no painel (ADR-0042 §4): buckets só nestes dois timers, sem tags de alta cardinalidade.
      percentiles-histogram:
        "[shf.copilot.pipeline.latency]": true
        "[shf.copilot.ai.latency]": true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
