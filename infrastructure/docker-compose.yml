# Infra LOCAL do Smart Health Finance (specs 06-development/local-development.md).
#
# Na raiz do repositório:
#   docker compose --env-file backend/.env -f infrastructure/docker-compose.yml up -d
#   docker compose --env-file backend/.env -f infrastructure/docker-compose.yml --profile observability up -d
#
# A API roda fora do Docker (IDE ou ./mvnw spring-boot:run com perfil "local").
# Portas publicadas apenas em 127.0.0.1. Credenciais sem default: obrigatórias em backend/.env.
# Versões alinhadas com src/test/.../TestcontainersConfiguration.java.

name: shf-local

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shf}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME em backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD em backend/.env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD em backend/.env}
    # Sem persistência: Redis nunca é source of truth.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq # nome estável: o RabbitMQ associa os dados do volume ao hostname
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?defina RABBITMQ_USERNAME em backend/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD em backend/.env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    # IdP OIDC local (issuer esperado por application-local.yml).
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?defina KEYCLOAK_ADMIN_USERNAME em backend/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD em backend/.env}
      # Fixa o "iss" dos tokens em http://localhost:<porta>, igual ao OIDC_ISSUER_URI da API.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      # Usuários sintéticos do realm: resolvidos pelos placeholders ${...} no JSON durante o import.
      SHF_DEV_ANA_USERNAME: ${SHF_DEV_ANA_USERNAME:?defina SHF_DEV_ANA_USERNAME em backend/.env}
      SHF_DEV_ANA_PASSWORD: ${SHF_DEV_ANA_PASSWORD:?defina SHF_DEV_ANA_PASSWORD em backend/.env}
      SHF_DEV_BRUNO_USERNAME: ${SHF_DEV_BRUNO_USERNAME:?defina SHF_DEV_BRUNO_USERNAME em backend/.env}
      SHF_DEV_BRUNO_PASSWORD: ${SHF_DEV_BRUNO_PASSWORD:?defina SHF_DEV_BRUNO_PASSWORD em backend/.env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-smart-health-finance.json:/opt/keycloak/data/import/realm-smart-health-finance.json:ro

  # ---------- App (opcional, profile "app") ----------
  # Sobe API + frontend em containers para visualizar o projeto sem IDE/JDK/Node na máquina:
  #   docker compose --env-file backend/.env -f infrastructure/docker-compose.yml --profile app up -d --build
  # Fluxo normal de desenvolvimento continua sendo API na IDE e `pnpm dev` no host (portas 8080/3000).

  api:
    profiles: ["app"]
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-shf}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      # O "iss" dos tokens continua http://localhost:<porta> (KC_HOSTNAME); as chaves são buscadas pela rede interna.
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/smart-health-finance
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/smart-health-finance/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SERVER_PORT: "8080"
      OTEL_EXPORT_ENABLED: "false"
      TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"

  web:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /repo/frontend
    # next dev com hot reload sobre o código montado do host.
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"]
    depends_on:
      - api
      - keycloak
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WATCHPACK_POLLING: "true" # bind mount do Windows não propaga eventos de arquivo
      APP_BASE_URL: http://localhost:3000
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/smart-health-finance
      OIDC_CLIENT_ID: shf-web
      API_BASE_URL: http://api:8080
      SESSION_SECRET: ${WEB_SESSION_SECRET:?defina WEB_SESSION_SECRET em backend/.env (min. 32 caracteres)}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../frontend:/repo/frontend
      - ../design:/repo/design:ro # fonte dos tokens/fontes (scripts/sync-design.mjs)
      # node_modules e .next ficam no container: os do host são binários Windows.
      - web-node-modules:/repo/frontend/node_modules
      - web-next:/repo/frontend/.next

  web-idp-bridge:
    # O servidor Next.js chama o IdP pela URL do issuer (localhost:<porta>). Este sidecar compartilha a rede do
    # container "web" e encaminha localhost:<porta> → keycloak:8080, mantendo o mesmo issuer do browser.
    profiles: ["app"]
    image: alpine/socat:latest
    network_mode: "service:web"
    depends_on:
      - web
    command: ["TCP-LISTEN:${KEYCLOAK_PORT:-8180},fork,reuseaddr", "TCP:keycloak:8080"]

  otel-lgtm:
    # Opcional: Grafana + Tempo + Loki + Prometheus + OTel Collector em um container.
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000" # Grafana (3000 fica livre para o Next.js)
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP

volumes:
  postgres-data:
  rabbitmq-data:
  web-node-modules:
  web-next:
