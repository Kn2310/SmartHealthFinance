---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

# --- Smart Health Finance (ADR-0044 §7, Parte D) ---------------------------------------------------------------
# Tudo acima é o prometheus.yaml original do grafana/otel-lgtm 0.41.0. Métricas da API entram por scrape (nomes
# idênticos aos do alerts.yml do Copilot); traces e logs seguem por OTLP. Actuator só na rede interna (api:8081).
scrape_configs:
  - job_name: shf-api
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
  # Profundidade das filas (inclusive DLQs *.dlq) pelo plugin rabbitmq_prometheus, já ligado na imagem oficial.
  # Só a família coarse por fila: nomes de fila, sem dado de usuário.
  - job_name: shf-rabbitmq
    scrape_interval: 30s
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
